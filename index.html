<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nova Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Syncopate:wght@400;700&display=swap">
<style>
/* Düzen: dikey ayna ekranı. Üstte logo ve saat, ortada LED çerçeveli kamera sahnesi (sağda dikey menü), altta içerik paneli. Yatay ekranda panel sağa geçer. */
:root{color-scheme:dark;--bg:#050914;--glass:rgba(12,22,46,.86);--glass2:rgba(24,40,78,.72);--line:rgba(130,178,255,.24);--acc:#46a8ff;--acc2:#8fd8ff;--warm:#ffe3bd;--txt:#eaf2ff;--mut:#8da2c6;--ok:#5fe0b0;
--font:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--logo:'Syncopate','Outfit',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(120% 80% at 70% 0%,#10224a 0%,var(--bg) 62%);color:var(--txt);font-family:var(--font);user-select:none;-webkit-user-select:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#app{height:100%;display:grid;gap:12px;grid-template-rows:auto minmax(0,1fr) minmax(0,38%);grid-template-areas:"top" "stage" "panel"}
@media (min-aspect-ratio:1/1){#app{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage panel"}}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--logo);line-height:1}
.logo b{display:block;font-size:24px;font-weight:700;letter-spacing:.2em}
.logo i{display:block;font-style:normal;font-size:11px;letter-spacing:.62em;color:var(--mut);margin-top:6px}
.o{display:inline-block;width:.84em;height:.84em;border-radius:50%;border:.14em solid var(--acc);border-right-color:var(--acc2);border-bottom-color:transparent;vertical-align:-.05em;margin:0 .05em;transform:rotate(-30deg)}
.clock{text-align:right;margin-left:auto}
.clock b{font-size:22px;font-weight:500;letter-spacing:.02em}
.clock small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.lang{display:flex;gap:6px}
.lang button{padding:8px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:13px}
.lang button.on{background:linear-gradient(135deg,var(--acc),#2f6fe0);border-color:transparent}
.stage{grid-area:stage;position:relative;min-height:0;border-radius:30px;overflow:hidden;background:#02050d;border:3px solid #fff1da;box-shadow:0 0 0 1px rgba(255,227,189,.5),0 0 28px rgba(255,227,189,.45),inset 0 0 40px rgba(0,0,0,.6)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#cam{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
.guide{display:none!important;position:absolute;inset:8% 22%;border:2px solid rgba(143,216,255,.5);border-radius:50%;pointer-events:none;box-shadow:inset 0 0 22px rgba(70,168,255,.22)}
.scan{position:absolute;left:12%;right:12%;top:8%;height:3px;background:linear-gradient(90deg,transparent,var(--acc2),transparent);box-shadow:0 0 18px var(--acc2);opacity:0;pointer-events:none}
.scan.run{animation:scan 1.6s ease-in-out forwards}
@keyframes scan{0%{top:8%;opacity:1}100%{top:90%;opacity:1}}
.badge{position:absolute;left:14px;top:14px;max-width:calc(100% - 100px);padding:8px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:14px;z-index:3}
.rail{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:3;max-height:88%;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{width:60px;flex:0 0 auto;padding:9px 0 7px;border-radius:17px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font:500 10px var(--font)}
.rail svg,.btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail button.on{border-color:var(--acc2);color:var(--acc2);box-shadow:0 0 18px rgba(70,168,255,.45)}
.actions{position:absolute;left:14px;right:84px;bottom:14px;display:flex;justify-content:center;gap:10px;z-index:3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:16px;background:linear-gradient(135deg,var(--acc),#2f6fe0);color:#fff;font:600 15px var(--font);box-shadow:0 8px 24px rgba(47,111,224,.4)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:none;}
.btn.round{padding:13px;width:50px}
.btn.rec{animation:pulse 1s infinite;border-color:var(--acc2)}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(70,168,255,.25)}}
.cover{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 76px 28px 28px;text-align:center;background:linear-gradient(180deg,rgba(5,9,20,.55),rgba(5,9,20,.86));}
.cover h2{font-size:26px}
.cmp{position:absolute;inset:0;z-index:6;background:#000;display:none;touch-action:none}
.cmp.on{display:block}
.cmp canvas{position:absolute;inset:0;width:100%;height:100%}
#cmpAfter{clip-path:inset(0 0 0 50%)}
.hd{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 12px #fff;transform:translateX(-1.5px);pointer-events:none}
.hd::after{content:"\2194";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;color:#0a1630;display:grid;place-items:center;font-size:20px}
.lb{position:absolute;top:14px;padding:6px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:13px}
.cmp .actions{left:0;right:0}
.panel{grid-area:panel;min-height:0;overflow-y:auto;border-radius:26px;background:var(--glass);border:1px solid var(--line);padding:16px;}
h2{margin:0 0 6px;font-size:19px;font-weight:600}
h3{margin:14px 0 8px;font-size:14px;font-weight:500;color:var(--acc2);letter-spacing:.04em}
.sub{color:var(--mut);font-size:14px;line-height:1.5;margin:0 0 10px}
.big{font-size:30px;font-weight:600;background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.card{flex:0 0 auto;min-width:140px;max-width:200px;padding:14px;border-radius:18px;background:var(--glass2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:15px}
.tag{align-self:flex-start;padding:3px 10px;border-radius:10px;background:rgba(70,168,255,.16);color:var(--acc2);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid .card{max-width:none}
.price{color:var(--ok);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:var(--glass2);font:500 14px var(--font)}
.sw{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:6px 0 10px}
.sw button{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.28)}
.sw button.on{border-color:#fff;box-shadow:0 0 0 4px rgba(70,168,255,.5),0 0 20px rgba(70,168,255,.5)}
.sw .nat{width:auto;height:auto;padding:12px 16px;border-radius:16px;background:var(--glass2);font:500 14px var(--font)}
input[type=range]{width:100%;accent-color:var(--acc);margin-top:8px}
.pad{height:10px}
.rows{display:grid;gap:10px;margin:6px 0 4px}
.srow{display:flex;align-items:center;gap:12px}
.srow small{display:block;color:var(--mut);font-size:12px}
.srow b{font-weight:500;font-size:15px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex:0 0 auto;display:block}
body.mirror{background:#000}
.stage.mirror{background:#000}
.stage.mirror #view,.stage.mirror .guide{visibility:hidden}
#chat{display:flex;flex-direction:column;gap:8px;max-height:30vh;overflow-y:auto;margin-bottom:10px}
.msg{padding:11px 15px;border-radius:16px;max-width:88%;line-height:1.45;font-size:15px}
.msg.n{background:var(--glass2);align-self:flex-start}.msg.u{background:rgba(70,168,255,.28);align-self:flex-end}
.send{display:flex;gap:8px;margin-top:10px}
.inp{flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font:400 15px var(--font);user-select:text;-webkit-user-select:text}
.attract{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;text-align:center;padding:32px;background:radial-gradient(90% 70% at 50% 30%,#12285a,#050914 70%)}
.attract.on{display:flex;animation:fade .6s}
.attract video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.attract .logo,.attract .ms,.attract .tap{position:relative}
.attract .logo b{font-size:40px}
.attract .ms{font-size:clamp(22px,4.6vw,40px);font-weight:300;line-height:1.3;max-width:18em;min-height:2.7em}
.attract .tap{color:var(--acc2);letter-spacing:.2em;font-size:13px;text-transform:uppercase}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

:root{--gold:#d8b879;--gold2:#f3e2b8}
.fams{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.fam{flex:0 0 auto;padding:9px 15px;border-radius:999px;border:1px solid rgba(216,184,121,.28);background:rgba(255,255,255,.03);color:var(--mut);font:500 12px var(--font);letter-spacing:.08em;text-transform:uppercase}
.fam.on{color:#1a1408;background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent;font-weight:600}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px;margin:4px 0 12px}
.cc{display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 8px 11px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(216,184,121,.22);text-align:center}
.cc b{font:600 12.5px var(--font);letter-spacing:.02em;color:var(--txt);line-height:1.2}
.cc small{font:500 9.5px var(--font);letter-spacing:.22em;color:var(--gold)}
.cc.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 26px rgba(216,184,121,.28)}
.cc.rec{min-width:92px}
.tress{display:block;width:100%;height:78px;border-radius:12px;background:linear-gradient(104deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 26%,rgba(0,0,0,0) 58%,rgba(0,0,0,.34) 100%),repeating-linear-gradient(93deg,rgba(255,255,255,.07) 0 2px,rgba(0,0,0,.09) 2px 4px),var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 6px 14px rgba(0,0,0,.35)}
.tress.sm{width:46px;height:34px;border-radius:9px;flex:0 0 auto}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:2px 0 6px}
.tools .nat{padding:12px 18px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(216,184,121,.28);color:var(--txt);font:500 14px var(--font)}
.tools .nat.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.own{position:relative;display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(216,184,121,.28);font:500 14px var(--font);color:var(--txt)}
.own.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.own input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cur{font:600 15px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin:8px 2px 2px}

.cat{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))!important;gap:8px!important}
.cc{padding:0 0 6px!important;gap:5px!important;border-radius:12px!important;background:transparent!important;border:1px solid transparent!important}
.cc.on{border-color:var(--gold)!important;box-shadow:0 0 0 1px var(--gold),0 6px 18px rgba(216,184,121,.3)!important}
.tile{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:11px 11px 8px 8px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.tile img{width:100%;height:100%;display:block;object-fit:cover}
.num{position:absolute;right:6px;bottom:4px;font:600 11.5px var(--font);font-style:normal;letter-spacing:.04em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.75)}
.cc b{font:500 10.5px var(--font)!important;line-height:1.15;padding:0 3px;max-width:100%}
.cc.rec{min-width:78px;width:78px}

.tw{display:block;width:80%;margin:0 auto;filter:drop-shadow(0 5px 6px rgba(0,0,0,.45))}
.tile{aspect-ratio:50/62!important;border-radius:0!important;box-shadow:none!important;clip-path:url(#swatchClip);overflow:hidden}
.tile .fold{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.num{left:0!important;right:0!important;bottom:7%!important;text-align:center}
.cc.rec{width:72px;min-width:72px}


/* v14: boya kataloğunda yapay zeka model fotoğrafı karoları */
.tw.ph{width:100%;filter:none}
.tile.ph{aspect-ratio:3/4!important;clip-path:none!important;border-radius:10px!important;box-shadow:0 3px 9px rgba(0,0,0,.5)!important;background:#0c1630}
.tile.ph .num{left:0!important;right:0!important;bottom:0!important;padding:14px 0 3px;font-size:10.5px;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.cc.rec{width:80px!important;min-width:80px!important}
/* AYNA MODU: gerçek çift yönlü ayna camı için. Siyah = ışık yok = ayna görünür. Menüler şeffaf, sadece ince çizgi ve yazı ışık verir. */
body.mirror{background:#000!important}
body.mirror .stage{border:0!important;box-shadow:none!important;background:#000!important;border-radius:0!important}
body.mirror .cover{background:transparent!important}
body.mirror .panel,body.mirror .card,body.mirror .cc,body.mirror .fam,body.mirror .btn,body.mirror .btn.ghost,body.mirror .rail button,body.mirror .badge,body.mirror .nat,body.mirror .own,body.mirror .srow,body.mirror .tools .nat{background:transparent!important;background-image:none!important;border:1px solid rgba(255,255,255,.3)!important;box-shadow:none!important;color:#fff}
body.mirror .fam.on,body.mirror .cc.on,body.mirror .nat.on,body.mirror .own.on,body.mirror .rail button.on{border-color:#f3e2b8!important;box-shadow:0 0 0 1px #f3e2b8!important}
body.mirror .fam.on{color:#f3e2b8}
body.mirror .tw{filter:none}
body.mirror .lang button{background:transparent!important;background-image:none!important;border:1px solid rgba(255,255,255,.3)!important;color:#fff}
body.mirror .lang button.on{border-color:#f3e2b8!important;color:#f3e2b8}

.scat{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin:4px 0 8px}
.sc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px 10px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(216,184,121,.22);text-align:center;color:var(--txt)}
.sc .art{display:block;width:100%;aspect-ratio:100/120;border-radius:12px;overflow:hidden;background:radial-gradient(90% 70% at 50% 25%,#26365f,#0b1430)}
.sc .art svg{width:100%;height:100%;display:block}
.sc b{font:600 12px var(--font);letter-spacing:.02em;line-height:1.2}
.sc small{font:500 10px var(--font);letter-spacing:.3em;color:var(--gold)}
.sc.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 24px rgba(216,184,121,.28)}
.selbox{margin-top:8px;padding:12px 14px;border-radius:16px;border:1px solid rgba(216,184,121,.3)}
.selbox h3{margin:0 0 6px;color:var(--gold2);font-weight:600}
.lock{margin-top:14px;padding:11px 16px;border-radius:14px;border:1px solid rgba(216,184,121,.3);background:transparent;color:var(--gold2);font:500 13px var(--font);letter-spacing:.06em}
.sve{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.svrow{display:grid;grid-template-columns:1fr 1fr 74px 36px;gap:6px;align-items:center}
.svrow .inp{padding:10px 9px;font-size:13px}
.svrow .pr{text-align:right}
.svrow .x{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:20px;line-height:1}
.chip.gold{border-color:var(--gold);color:var(--gold2)}
body.mirror .sc,body.mirror .lock,body.mirror .chip,body.mirror .selbox,body.mirror .sc .art{background:transparent!important;background-image:none!important;border-color:rgba(255,255,255,.3)!important;box-shadow:none!important}
body.mirror .sc.on{border-color:#f3e2b8!important;box-shadow:0 0 0 1px #f3e2b8!important}
.sc .art{aspect-ratio:264/367!important}
.sc .art img{width:100%;height:100%;object-fit:cover;display:block}
.sc .art{background:#0b1430}
</style>

  return `<span class="tw"><span class="tile"><img src="${tressURL(i)}" alt=""><svg class="fold" viewBox="0 0 50 62" preserveAspectRatio="none"><path d="M16 5 C 28 13, 35 30, 36 54" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.5"/><path d="M17.4 6.4 C 29 14.5, 36.4 31, 37.4 54" fill="none" stroke="rgba(255,255,255,.36)" stroke-width="1"/></svg><i class="num">${dyeCode(i)}</i></span></span>`;

function hairArt(id,hex,u){
  const [r,g,b]=rgb(hex),mx=(f)=>{const t=Math.abs(f),k=f>0?255:0;return`rgb(${Math.round(r+(k-r)*t)},${Math.round(g+(k-g)*t)},${Math.round(b+(k-b)*t)})`};
  const A=ART[id]||{};
  return `<svg viewBox="0 0 100 120" aria-hidden="true"><defs><linearGradient id="hg${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${mx(.22)}"/><stop offset=".5" stop-color="${hex}"/><stop offset="1" stop-color="${mx(-.3)}"/></linearGradient><linearGradient id="sk${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d6c0"/><stop offset="1" stop-color="#dcb89c"/></linearGradient></defs><path d="M16 121 C20 101 36 93 50 93 C64 93 80 101 84 121 Z" fill="#2b3550"/><g fill="url(#hg${u})" stroke="rgba(0,0,0,.28)" stroke-width=".7">${A.b||""}</g><rect x="43" y="74" width="14" height="22" rx="6" fill="url(#sk${u})"/><ellipse cx="50" cy="56" rx="19" ry="24" fill="url(#sk${u})"/><g fill="url(#hg${u})" stroke="rgba(0,0,0,.28)" stroke-width=".7">${A.f||""}</g></svg>`;
}

function resize(){
  const r=$("stage").getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
  let w=Math.round(r.width*d),h=Math.round(r.height*d);const m=Math.max(w,h);
  if(m>MAX_RES){w=Math.round(w*MAX_RES/m);h=Math.round(h*MAX_RES/m)}
  if(w<2||h<2)return;
  if(view.width!==w||view.height!==h){view.width=w;view.height=h}
  const ww=256,wh=Math.max(64,Math.round(256*h/w));
  if(work.width!==ww||work.height!==wh){work.width=ww;work.height=wh;layerReady=false}
}
new ResizeObserver(resize).observe($("stage"));
function drawCover(ctx,src,w,h){
  const sw=src.videoWidth||src.width,sh=src.videoHeight||src.height;if(!sw||!sh)return;
  const s=Math.max(w/sw,h/sh),dw=sw*s,dh=sh*s;
  ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(src,(w-dw)/2,(h-dh)/2,dw,dh);ctx.restore();
}
function segment(){
  if(!segmenter||segSwitching)return;
  const t0=performance.now();
  drawCover(wctx,cam,work.width,work.height);
  try{segmenter.segmentForVideo(work,performance.now(),res=>{
    const cm=res.categoryMask;if(!cm){segErr="maske yok";return}
    const f=cm.getAsUint8Array(),w=cm.width,h=cm.height,n=f.length;
    if(layer.width!==w||layer.height!==h){layer.width=w;layer.height=h;parts.width=w;parts.height=h;smooth=null}
    if(!smooth||smooth.length!==n)smooth=new Float32Array(n);
    if(samp.width!==work.width||samp.height!==work.height){samp.width=work.width;samp.height=work.height}
    sctx.drawImage(work,0,0);
    const px=sctx.getImageData(0,0,work.width,work.height).data,sx=work.width/w,sy=work.height/h;
    let mx=0;
    const cnt=[0,0,0,0,0,0],sr=[0,0,0,0,0,0],sg=[0,0,0,0,0,0],sb=[0,0,0,0,0,0],sm=[0,0,0,0,0,0];
    if(!hidBuf||hidBuf.width!==w||hidBuf.height!==h)hidBuf=lctx.createImageData(w,h);
    if(showParts&&(!pidBuf||pidBuf.width!==w||pidBuf.height!==h))pidBuf=pctx.createImageData(w,h);
    const hid=hidBuf,hd=hid.data,pid=showParts?pidBuf:null;
    const [r,g,b]=colorIdx!==null?rgb(COLORS[colorIdx].c):[0,0,0];
    for(let i=0,j=0;i<n;i++,j+=4){
      const fv=f[i];if(fv>mx)mx=fv;const c=fv<6?fv:5;cnt[c]++;
      if(c>0&&(i&3)===0){const x=((i%w)*sx)|0,y=(((i/w)|0)*sy)|0,k=(y*work.width+x)*4;sr[c]+=px[k];sg[c]+=px[k+1];sb[c]+=px[k+2];sm[c]++}
      const s=smooth[i]=smooth[i]*.55+(c===1?.45:0);
      const a=s<.25?0:Math.min(1,(s-.25)/.5);
      hd[j]=r;hd[j+1]=g;hd[j+2]=b;hd[j+3]=a*255;
      if(pid){if(c>0){const q=CLS_COL[c];pid.data[j]=q[0];pid.data[j+1]=q[1];pid.data[j+2]=q[2];pid.data[j+3]=115}else pid.data[j+3]=0}
    }
    lctx.putImageData(hid,0,0);
    if(layerB.width!==w||layerB.height!==h){layerB.width=w;layerB.height=h}
    lbctx.clearRect(0,0,w,h);lbctx.filter="blur(1.5px)";lbctx.drawImage(layer,0,0);lbctx.filter="none";layerReady=true;
    if(pid){pctx.putImageData(pid,0,0);partsReady=true}
    const avg=c=>sm[c]>8?[(sr[c]/sm[c])|0,(sg[c]/sm[c])|0,(sb[c]/sm[c])|0]:null;
    let ls=0,ln=0;for(let k=0;k<px.length;k+=64){ls+=px[k]*.3+px[k+1]*.59+px[k+2]*.11;ln++}
    scene={pct:cnt.map(v=>v/n),col:{1:avg(1),2:avg(2),3:avg(3),4:avg(4)},dbg:{del:segDel,w,h,mx,lum:Math.round(ls/Math.max(1,ln)),pct:cnt.map(v=>Math.round(v/n*100))}};
    hairPct=scene.pct[1];segFailCnt=0;segErr="";segRuns++;
    segGap=Math.min(400,Math.max(110,(performance.now()-t0)*2.5));
    if(segRuns===1||segRuns%10===0){refreshBadge();renderScene()}
  })}catch(e){
    segFailCnt++;segErr=String((e&&e.message)||e).slice(0,60);
    if(segFailCnt>=2&&segDel==="GPU"&&!segSwitching){segSwitching=true;segmenter=null;makeSegmenter("CPU").finally(()=>{segSwitching=false;segFailCnt=0;refreshBadge()})}
    else if(segFailCnt%10===2)refreshBadge();
  }
}
let lmS=null;
function paintHair(){
  const Lt=lum(COLORS[colorIdx].c);
  const hc=scene&&scene.col&&scene.col[1];
  const lm0=hc?(.2126*hc[0]+.7152*hc[1]+.0722*hc[2])/255:.25;
  lmS=lmS===null?lm0:lmS*.85+lm0*.15;
  const A=Math.min(1,intensity),up=Lt-lmS,dn=lmS-Lt;
  vctx.save();vctx.imageSmoothingEnabled=true;vctx.imageSmoothingQuality="high";
  /* 1) Parlaklık: saç hedef renkten açıksa aydınlat, koyuysa karart (renk tek başına ton değiştirir, açıklığı değiştirmez) */
  if(up>.05){vctx.globalAlpha=A*Math.min(.85,up*1.3);vctx.globalCompositeOperation="screen";vctx.drawImage(layerB,0,0,view.width,view.height)}
  else if(dn>.05){vctx.globalAlpha=A*Math.min(.85,dn*1.3);vctx.globalCompositeOperation="multiply";vctx.drawImage(layerB,0,0,view.width,view.height)}
  /* 2) Ton ve doygunluk: gerçek saç dokusunu (teller, gölge, parlama) koruyarak rengi uygula */
  vctx.globalAlpha=A;vctx.globalCompositeOperation="color";
  vctx.drawImage(layerB,0,0,view.width,view.height);
  vctx.restore();
}
function frame(ts){
  if(!running)return;
  drawCover(vctx,cam,view.width,view.height);
  const live=colorIdx!==null||showParts;
  if((live||tab==="face")&&segmenter&&ts-lastSeg>(live?segGap:400)){lastSeg=ts;segment()}
  if(colorIdx!==null&&layerReady)paintHair();
  if(showParts&&partsReady)vctx.drawImage(parts,0,0,view.width,view.height);
  requestAnimationFrame(frame);
}

async function startCam(){
  try{
    setBadge(T().loadingAI);
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});
    cam.srcObject=stream;await cam.play();
  }catch(e){setBadge(T().camerr,4000);return}
  running=true;$("cover").hidden=true;resize();requestAnimationFrame(frame);loadModels();
}
async function makeSegmenter(del){
  try{
    segmenter=await vision.ImageSegmenter.createFromOptions(fileset,{baseOptions:{modelAssetPath:SEG_URL,delegate:del},runningMode:"VIDEO",outputConfidenceMasks:false,outputCategoryMask:true});
    segDel=del;segErr="";return true;
  }catch(e){segmenter=null;segErr=String((e&&e.message)||e).slice(0,60);return false}
}
async function loadModels(){
  if(modelsState!=="idle")return;modelsState="loading";setBadge(T().loadingAI);
  const v="0.10.14",base=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${v}`;
  try{
    vision=await import(base+"/vision_bundle.mjs");
    fileset=await vision.FilesetResolver.forVisionTasks(base+"/wasm");
    try{landmarker=await vision.FaceLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:LM_URL},runningMode:"IMAGE",numFaces:1})}catch(e){}
    for(const d of(SEG_DELEGATE==="GPU"?["GPU","CPU"]:["CPU","GPU"])){if(await makeSegmenter(d))break}
    modelsState=(landmarker||segmenter)?"ready":"fail";
  }catch(e){modelsState="fail";segErr=String((e&&e.message)||e).slice(0,60)}
  if(modelsState==="fail"&&++loadTries<3)setTimeout(()=>{modelsState="idle";loadModels()},4000);
  refreshBadge();
}
const FACE={top:10,chin:152,cl:234,cr:454,jl:172,jr:397,fl:54,fr:284};
const dist=(a,b,w,h)=>Math.hypot((a.x-b.x)*w,(a.y-b.y)*h);
function classify(lm,w,h){
  const L=dist(lm[FACE.top],lm[FACE.chin],w,h),cheek=dist(lm[FACE.cl],lm[FACE.cr],w,h),jaw=dist(lm[FACE.jl],lm[FACE.jr],w,h),fore=dist(lm[FACE.fl],lm[FACE.fr],w,h);
  const lw=L/cheek,jc=jaw/cheek,fc=fore/cheek;
  if(lw>1.48)return"oblong";
  if(jc<.76&&fc>.82)return"heart";
  if(lw<1.28)return jc>.88?"square":"round";
  return jc>.9&&lw<1.38?"square":"oval";
}
async function analyze(){
  if(!running){setBadge(T().needCam,2500);return}
  if(!landmarker){setBadge(modelsState==="loading"?T().loadingAI:T().aiFail,3000);return}
  const c=document.createElement("canvas");c.width=cam.videoWidth;c.height=cam.videoHeight;c.getContext("2d").drawImage(cam,0,0);
  const res=landmarker.detect(c),sc=$("scan");
  sc.classList.remove("run");void sc.offsetWidth;sc.classList.add("run");
  await new Promise(r=>setTimeout(r,1700));sc.classList.remove("run");
  if(!res.faceLandmarks.length){setBadge(T().noface,3500);speak(T().noface);return}
  setShape(classify(res.faceLandmarks[0],c.width,c.height));
}

function setBadge(text,ms){

  if(ms)badgeTimer=setTimeout(refreshBadge,ms);
}
function refreshBadge(){
  const t=T(),e=segErr?" ("+segErr+")":"",hairOn=colorIdx!==null&&running;
  if(modelsState==="loading")setBadge(t.loadingAI);
  else if(modelsState==="fail")setBadge(t.aiFail+e);
  else if(hairOn&&!segmenter&&!segSwitching)setBadge(t.segFail+e);
  else if(hairOn&&segmenter&&segFailCnt>=2)setBadge(t.segRun+e);
  else if(hairOn&&segmenter&&hairPct>=0&&hairPct<.004)setBadge(t.nohair);
  else if(shape)setBadge(`${t.shapeL}: ${SHAPES[shape][lang]}`);
  else setBadge("");

    }else{
      h+=`<p class="sub">${t.editHint}</p><div class="sve">${services.map((x,i)=>`<div class="svrow"><input class="inp" data-sv="${i}" data-f="tr" value="${esc(x.tr||"")}" placeholder="TR"><input class="inp" data-sv="${i}" data-f="de" value="${esc(x.de||"")}" placeholder="DE"><input class="inp pr" type="number" min="0" step="1" inputmode="decimal" data-sv="${i}" data-f="p" value="${+x.p||0}"><button class="x" data-act="sv-del" data-v="${i}" aria-label="sil">&times;</button></div>`).join("")}</div><div class="chips"><button class="chip" data-act="sv-add">+ ${t.addSv}</button><button class="chip" data-act="sv-reset">${t.resetSv}</button><button class="chip" data-act="sv-pin">${t.changePin}</button><button class="chip gold" data-act="sv-done">${t.doneSv}</button></div>`;
    }
  }else{
    h+=`<div id="chat"></div><div class="chips">${t.chips.map(c=>`<button class="chip" data-act="ask" data-v="${c}">${c}</button>`).join("")}</div><div class="send"><input id="inp" class="inp" placeholder="${t.ask}" autocomplete="off"><button class="btn" data-act="send" aria-label="send">&#10148;</button></div>`;
  }
  p.innerHTML=h;if(tab==="chat")renderChat();if(tab==="face")renderScene();
}
function hslOf(c){
  const r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return[h,s,l];
}
function colorName(c){
  const[h,s,l]=hslOf(c);
  const N=lang==="de"?["Schwarz","Weiß","Grau","Braun","Rot","Orange","Gelb","Grün","Türkis","Blau","Lila","Rosa","dunkel","hell"]:["Siyah","Beyaz","Gri","Kahverengi","Kırmızı","Turuncu","Sarı","Yeşil","Turkuaz","Mavi","Mor","Pembe","koyu","açık"];
  const[bk,wh,gy,br,rd,or,ye,gr,cy,bl,pu,pk,dk,lt]=N;
  if(l<.1)return bk;if(l>.92)return wh;
  let n;
  if(s<.14)n=gy;
  else if(h<15||h>=345)n=l<.3?br:rd;
  else if(h<45)n=l<.55?br:or;
  else if(h<70)n=l<.45?br:ye;
  else if(h<165)n=gr;else if(h<200)n=cy;else if(h<255)n=bl;else if(h<290)n=pu;else n=pk;
  const pre=n===br?(l<.2?dk:l>.5?lt:""):(l<.3?dk:l>.7?lt:"");
  return pre?`${n} (${pre})`:n;
}
function renderScene(){
  const t=T(),msg=$("sceneMsg");if(!msg)return;
  const rb=$("recBox"),dbg=$("techLine");
  if(dbg){const d=scene&&scene.dbg;dbg.textContent=d?`Teknik: ${d.del} · maske ${d.w}×${d.h} · en büyük değer ${d.mx} · sınıflar ${d.pct.join("/")} · parlaklık ${d.lum} · çalışma ${segRuns}`:`Teknik: model ${segmenter?"hazır ("+segDel+")":"yok"} · çalışma ${segRuns}${segErr?" · "+segErr:""}`}
  const set=(k,col,text)=>{const sw=$("sw"+k),tx=$("tx"+k);if(!sw||!tx)return;
    if(col){sw.style.background=`rgb(${col[0]},${col[1]},${col[2]})`;tx.textContent=text||colorName(col)}
    else{sw.style.background="transparent";tx.textContent="–"}};
  if(!scene||scene.pct[1]+scene.pct[2]+scene.pct[3]+scene.pct[4]<.02){
    msg.textContent=scene?t.noPerson:(running?t.lookingAt:t.sceneHint);
    set("H",null);set("S",null);set("C",null);
    if(rb&&rb.dataset.k){rb.innerHTML="";rb.dataset.k=""}
    return;
  }
  msg.textContent="";
  const p=scene.pct,sk=scene.col[3]||scene.col[2];
  set("H",p[1]>.01?scene.col[1]:null,`${p[1]>.01&&scene.col[1]?colorName(scene.col[1]):""} · %${Math.round(p[1]*100)}`);
  let tone="neutral";
  if(sk){const hh=hslOf(sk)[0];tone=hh>=26?"warm":hh<=14?"cool":"neutral"}
  const lv=sk?hslOf(sk)[2]:0;
  set("S",sk,sk?`${t.skinLv[lv>.62?0:lv>.38?1:2]} · ${t[tone]}`:"");
  set("C",scene.col[4]);
  if(rb&&rb.dataset.k!==tone){
    const idx={warm:[3,5,2,1],cool:[4,8,6,9],neutral:[1,2,6,3]}[tone];
    rb.innerHTML=idx.map(i=>`<button class="cc rec" data-act="rec" data-v="${i}">${tileHTML(i)}<b>${COLORS[i][lang]}</b></button>`).join("");
    rb.dataset.k=tone;
  }
}
function toggleMode(){
  mirrorMode=!mirrorMode;
  $("stage").classList.toggle("mirror",mirrorMode);document.body.classList.toggle("mirror",mirrorMode);
  actions();setBadge(mirrorMode?T().mirrorNote:T().tryNote,4500);
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderChat(){
  const box=$("chat");if(!box)return;
  if(!chatLog.length)chatLog.push({n:1,t:T().hello});
  box.innerHTML=chatLog.map(m=>`<div class="msg ${m.n?"n":"u"}">${esc(m.t)}</div>`).join("");box.scrollTop=box.scrollHeight;
}
function setLang(l){
  lang=l;document.documentElement.lang=l;
  $("l-tr").classList.toggle("on",l==="tr");$("l-de").classList.toggle("on",l==="de");
  rail();actions();cover();panel();clock();refreshBadge();$("adTap").textContent=T().tap;
  if(rec)rec.lang=T().speech;
}
function clock(){
  const d=new Date(),loc=lang==="de"?"de-DE":"tr-TR";
  $("clk").textContent=d.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"});
  $("dt").textContent=d.toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long"});
}

/* ================= SES VE SOHBET ================= */
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang=T().speech;
  const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith(T().speech.slice(0,2)));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function toggleMic(){
  if(!SR){setBadge(T().nomic,3500);return}
  if(listening){rec.stop();return}
  if(tab!=="chat"){tab="chat";rail();panel()}
  speechSynthesis.cancel();
  rec=new SR();rec.lang=T().speech;rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{listening=true;setBadge(T().listening);actions()};
  rec.onend=()=>{listening=false;refreshBadge();actions()};
  rec.onerror=()=>{};
  rec.onresult=e=>ask(e.results[0][0].transcript);
  rec.start();
}
async function brain(q){
  if(AI_ENDPOINT){
    try{const r=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang,message:q,faceShape:shape})});const j=await r.json();if(j.reply)return j.reply}catch(e){}
  }
  const k=T().kw,s=q.toLowerCase();
  if(k.thanks.test(s))return T().thanks;
  if(k.price.test(s))return T().price+services.slice(0,5).map(x=>`${x[lang]||x.tr} ${eur(+x.p||0)}`).join(", ")+".";
  if(k.color.test(s))return T().colors(COLORS.map(c=>c[lang]).join(", "));
  if(k.style.test(s))return shape?T().sugg(SHAPES[shape]["s_"+lang].slice(0,3).join(", ")):T().askFace;
  if(k.hello.test(s))return T().hello;
  return T().fallback;
}
async function ask(q){
  q=(q||"").trim();if(!q)return;
  if(tab!=="chat"){tab="chat";rail();panel()}
  chatLog.push({n:0,t:q});renderChat();
  const a=await brain(q);chatLog.push({n:1,t:a});renderChat();speak(a);
  const i=$("inp");if(i)i.value="";
}

/* ================= OLAYLAR ================= */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==="lang")setLang(v);
  else if(a==="tab"){if(v!=="menu")editSV=false;tab=v;rail();panel()}
  else if(a==="start")startCam();
  else if(a==="analyze")analyze();
  else if(a==="photo")photo();
  else if(a==="mode")toggleMode();
  else if(a==="parts"){showParts=!showParts;partsReady=false;panel()}
  else if(a==="rec"){colorIdx=+v;layerReady=false;hairPct=-1;lmS=null;if(!running)setBadge(T().needCam,2500);else{loadModels();refreshBadge()}panel()}
  else if(a==="fam"){colFam=v;panel()}
  else if(a==="sty"){styleSel=styleSel===v?null:v;panel()}
  else if(a==="sfam"){styleCat=v;panel()}
  else if(a==="sv-edit"){
    const t=T(),pin=getPin();
    if(!pin){const n=prompt(t.newPin);if(n!==null){if(/^\d{4,6}$/.test(n)){setPin(n);editSV=true}else alert(t.pinRule)}}
    else{const x=prompt(t.askPin);if(x!==null){if(x===pin)editSV=true;else alert(t.pinWrong)}}
    panel();
  }
  else if(a==="sv-pin"){const n=prompt(T().newPin);if(n!==null){if(/^\d{4,6}$/.test(n))setPin(n);else alert(T().pinRule)}}
  else if(a==="sv-del"){services.splice(+v,1);saveSV();panel()}
  else if(a==="sv-add"){services.push({tr:"Yeni hizmet",de:"Neue Leistung",p:0});saveSV();panel()}
  else if(a==="sv-reset"){if(confirm(T().confirmReset)){services=SERVICES.map(x=>({...x}));saveSV();panel()}}
  else if(a==="sv-done"){editSV=false;panel()}
  else if(a==="mic")toggleMic();
  else if(a==="shape")setShape(v);
  else if(a==="again"){shape=null;refreshBadge();panel()}
  else if(a==="color"){
    colorIdx=v==="none"?null:+v;layerReady=false;hairPct=-1;lmS=null;
    if(colorIdx!==null){if(!running)setBadge(T().needCam,2500);else{loadModels();refreshBadge()}}
    else refreshBadge();
    panel();
  }
  else if(a==="ask")ask(v);
  else if(a==="send")ask($("inp").value);
  else if(a==="closecmp")$("cmp").classList.remove("on");
  else if(a==="save")save();
});
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.sv!==undefined){const i=+e.target.dataset.sv,f=e.target.dataset.f;if(services[i]){services[i][f]=f==="p"?(+e.target.value||0):e.target.value;saveSV()}}
  else if(e.target.id==="int")intensity=e.target.value/100;
  else if(e.target.id==="cc"){
    COLORS[CUSTOM_IDX].c=e.target.value;colorIdx=CUSTOM_IDX;layerReady=false;hairPct=-1;lmS=null;
    const lb=e.target.parentElement;lb.classList.add("on");const sm=lb.querySelector(".tress");if(sm)sm.style.setProperty("--c",e.target.value);
    document.querySelectorAll(".cc.on,.nat.on").forEach(x=>x.classList.remove("on"));
    if(!running)setBadge(T().needCam,2500);else{loadModels();refreshBadge()}
  }
});
document.addEventListener("keydown",e=>{if(e.target.id==="inp"&&e.key==="Enter")ask(e.target.value)});

/* ================= REKLAM EKRANI ================= */
const atr=$("attract");
function adTick(){
  if(!atr.classList.contains("on"))return;
  const L=ADS[lang];adIdx=(adIdx+1)%L.length;$("adMsg").textContent=L[adIdx];
}
function showAttract(){
  atr.classList.add("on");adIdx=0;$("adMsg").textContent=ADS[lang][0];$("adTap").textContent=T().tap;
  const v=$("adVid");if(ADS.video){v.src=ADS.video;v.hidden=false;v.play().catch(()=>{})}
}
function touch(){lastTouch=Date.now()}
["pointerdown","pointermove","keydown"].forEach(n=>window.addEventListener(n,touch,{passive:true}));
atr.addEventListener("pointerdown",()=>{atr.classList.remove("on");$("adVid").pause();touch()});
setInterval(()=>{
  clock();
  if(!atr.classList.contains("on")&&!listening&&!$("cmp").classList.contains("on")&&Date.now()-lastTouch>IDLE_MS)showAttract();
},1000);
setInterval(adTick,5000);
setInterval(()=>{if(tab==="face")renderScene()},1500);

/* ================= BAŞLAT ================= */
if("speechSynthesis" in window)speechSynthesis.getVoices();
resize();setLang("tr");
