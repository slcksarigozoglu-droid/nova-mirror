<!doctype html>
<html lang="tr">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nova Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Syncopate:wght@400;700&display=swap">
<style>
/* Düzen: dikey ayna ekranı. Üstte logo ve saat, ortada LED çerçeveli kamera sahnesi (sağda dikey menü), altta içerik paneli. Yatay ekranda panel sağa geçer. */
:root{color-scheme:dark;--bg:#050914;--glass:rgba(12,22,46,.86);--glass2:rgba(24,40,78,.72);--line:rgba(130,178,255,.24);--acc:#46a8ff;--acc2:#8fd8ff;--warm:#ffe3bd;--txt:#eaf2ff;--mut:#8da2c6;--ok:#5fe0b0;
--font:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--logo:'Syncopate','Outfit',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(120% 80% at 70% 0%,#10224a 0%,var(--bg) 62%);color:var(--txt);font-family:var(--font);user-select:none;-webkit-user-select:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#app{height:100%;display:grid;gap:12px;grid-template-rows:auto minmax(0,1fr) minmax(0,38%);grid-template-areas:"top" "stage" "panel"}
@media (min-aspect-ratio:1/1){#app{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage panel"}}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--logo);line-height:1}
.logo b{display:block;font-size:24px;font-weight:700;letter-spacing:.2em}
.logo i{display:block;font-style:normal;font-size:11px;letter-spacing:.62em;color:var(--mut);margin-top:6px}
.o{display:inline-block;width:.84em;height:.84em;border-radius:50%;border:.14em solid var(--acc);border-right-color:var(--acc2);border-bottom-color:transparent;vertical-align:-.05em;margin:0 .05em;transform:rotate(-30deg)}
.clock{text-align:right;margin-left:auto}
.clock b{font-size:22px;font-weight:500;letter-spacing:.02em}
.clock small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.lang{display:flex;gap:6px}
.lang button{padding:8px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:13px}
.lang button.on{background:linear-gradient(135deg,var(--acc),#2f6fe0);border-color:transparent}
.stage{grid-area:stage;position:relative;min-height:0;border-radius:30px;overflow:hidden;background:#02050d;border:3px solid #fff1da;box-shadow:0 0 0 1px rgba(255,227,189,.5),0 0 28px rgba(255,227,189,.45),inset 0 0 40px rgba(0,0,0,.6)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#cam{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
.guide{position:absolute;inset:8% 22%;border:2px solid rgba(143,216,255,.5);border-radius:50%;pointer-events:none;box-shadow:inset 0 0 22px rgba(70,168,255,.22)}
.scan{position:absolute;left:12%;right:12%;top:8%;height:3px;background:linear-gradient(90deg,transparent,var(--acc2),transparent);box-shadow:0 0 18px var(--acc2);opacity:0;pointer-events:none}
.scan.run{animation:scan 1.6s ease-in-out forwards}
@keyframes scan{0%{top:8%;opacity:1}100%{top:90%;opacity:1}}
.badge{position:absolute;left:14px;top:14px;max-width:calc(100% - 100px);padding:8px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:14px;z-index:3}
.rail{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:3;max-height:88%;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{width:60px;flex:0 0 auto;padding:9px 0 7px;border-radius:17px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font:500 10px var(--font)}
.rail svg,.btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail button.on{border-color:var(--acc2);color:var(--acc2);box-shadow:0 0 18px rgba(70,168,255,.45)}
.actions{position:absolute;left:14px;right:84px;bottom:14px;display:flex;justify-content:center;gap:10px;z-index:3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:16px;background:linear-gradient(135deg,var(--acc),#2f6fe0);color:#fff;font:600 15px var(--font);box-shadow:0 8px 24px rgba(47,111,224,.4)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:none;}
.btn.round{padding:13px;width:50px}
.btn.rec{animation:pulse 1s infinite;border-color:var(--acc2)}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(70,168,255,.25)}}
.cover{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 76px 28px 28px;text-align:center;background:linear-gradient(180deg,rgba(5,9,20,.55),rgba(5,9,20,.86));}
.cover h2{font-size:26px}
.cmp{position:absolute;inset:0;z-index:6;background:#000;display:none;touch-action:none}
.cmp.on{display:block}
.cmp canvas{position:absolute;inset:0;width:100%;height:100%}
#cmpAfter{clip-path:inset(0 0 0 50%)}
.hd{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 12px #fff;transform:translateX(-1.5px);pointer-events:none}
.hd::after{content:"\2194";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;color:#0a1630;display:grid;place-items:center;font-size:20px}
.lb{position:absolute;top:14px;padding:6px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:13px}
.cmp .actions{left:0;right:0}
.panel{grid-area:panel;min-height:0;overflow-y:auto;border-radius:26px;background:var(--glass);border:1px solid var(--line);padding:16px;}
h2{margin:0 0 6px;font-size:19px;font-weight:600}
h3{margin:14px 0 8px;font-size:14px;font-weight:500;color:var(--acc2);letter-spacing:.04em}
.sub{color:var(--mut);font-size:14px;line-height:1.5;margin:0 0 10px}
.big{font-size:30px;font-weight:600;background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.card{flex:0 0 auto;min-width:140px;max-width:200px;padding:14px;border-radius:18px;background:var(--glass2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:15px}
.tag{align-self:flex-start;padding:3px 10px;border-radius:10px;background:rgba(70,168,255,.16);color:var(--acc2);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid .card{max-width:none}
.price{color:var(--ok);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:var(--glass2);font:500 14px var(--font)}
.sw{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:6px 0 10px}
.sw button{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.28)}
.sw button.on{border-color:#fff;box-shadow:0 0 0 4px rgba(70,168,255,.5),0 0 20px rgba(70,168,255,.5)}
.sw .nat{width:auto;height:auto;padding:12px 16px;border-radius:16px;background:var(--glass2);font:500 14px var(--font)}
input[type=range]{width:100%;accent-color:var(--acc);margin-top:8px}
.pad{height:10px}
.rows{display:grid;gap:10px;margin:6px 0 4px}
.srow{display:flex;align-items:center;gap:12px}
.srow small{display:block;color:var(--mut);font-size:12px}
.srow b{font-weight:500;font-size:15px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex:0 0 auto;display:block}
body.mirror{background:#000}
.stage.mirror{background:#000}
.stage.mirror #view,.stage.mirror .guide{visibility:hidden}
#chat{display:flex;flex-direction:column;gap:8px;max-height:30vh;overflow-y:auto;margin-bottom:10px}
.msg{padding:11px 15px;border-radius:16px;max-width:88%;line-height:1.45;font-size:15px}
.msg.n{background:var(--glass2);align-self:flex-start}.msg.u{background:rgba(70,168,255,.28);align-self:flex-end}
.send{display:flex;gap:8px;margin-top:10px}
.inp{flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font:400 15px var(--font);user-select:text;-webkit-user-select:text}
.attract{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;text-align:center;padding:32px;background:radial-gradient(90% 70% at 50% 30%,#12285a,#050914 70%)}
.attract.on{display:flex;animation:fade .6s}
.attract video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.attract .logo,.attract .ms,.attract .tap{position:relative}
.attract .logo b{font-size:40px}
.attract .ms{font-size:clamp(22px,4.6vw,40px);font-weight:300;line-height:1.3;max-width:18em;min-height:2.7em}
.attract .tap{color:var(--acc2);letter-spacing:.2em;font-size:13px;text-transform:uppercase}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

function resize(){
  const r=$("stage").getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
  let w=Math.round(r.width*d),h=Math.round(r.height*d);const m=Math.max(w,h);
  if(m>MAX_RES){w=Math.round(w*MAX_RES/m);h=Math.round(h*MAX_RES/m)}
  if(w<2||h<2)return;
  if(view.width!==w||view.height!==h){view.width=w;view.height=h}
  const ww=256,wh=Math.max(64,Math.round(256*h/w));
  if(work.width!==ww||work.height!==wh){work.width=ww;work.height=wh;layerReady=false}
}

function drawCover(ctx,src,w,h){
  const sw=src.videoWidth||src.width,sh=src.videoHeight||src.height;if(!sw||!sh)return;
  const s=Math.max(w/sw,h/sh),dw=sw*s,dh=sh*s;

}
function segment(){

  try{segmenter.segmentForVideo(work,performance.now(),res=>{
    const cm=res.categoryMask;if(!cm){segErr="maske yok";return}
    const f=cm.getAsUint8Array(),w=cm.width,h=cm.height,n=f.length;
    if(layer.width!==w||layer.height!==h){layer.width=w;layer.height=h;parts.width=w;parts.height=h;smooth=null}
    if(!smooth||smooth.length!==n)smooth=new Float32Array(n);
    if(samp.width!==work.width||samp.height!==work.height){samp.width=work.width;samp.height=work.height}
    sctx.drawImage(work,0,0);
    const px=sctx.getImageData(0,0,work.width,work.height).data,sx=work.width/w,sy=work.height/h;
    let mx=0;
    const cnt=[0,0,0,0,0,0],sr=[0,0,0,0,0,0],sg=[0,0,0,0,0,0],sb=[0,0,0,0,0,0],sm=[0,0,0,0,0,0];
    if(!hidBuf||hidBuf.width!==w||hidBuf.height!==h)hidBuf=lctx.createImageData(w,h);
    if(showParts&&(!pidBuf||pidBuf.width!==w||pidBuf.height!==h))pidBuf=pctx.createImageData(w,h);
    const hid=hidBuf,hd=hid.data,pid=showParts?pidBuf:null;
    const [r,g,b]=colorIdx!==null?rgb(COLORS[colorIdx].c):[0,0,0];
    for(let i=0,j=0;i<n;i++,j+=4){
      const fv=f[i];if(fv>mx)mx=fv;const c=fv<6?fv:5;cnt[c]++;
      if(c>0&&(i&3)===0){const x=((i%w)*sx)|0,y=(((i/w)|0)*sy)|0,k=(y*work.width+x)*4;sr[c]+=px[k];sg[c]+=px[k+1];sb[c]+=px[k+2];sm[c]++}
      const s=smooth[i]=smooth[i]*.55+(c===1?.45:0);
      const a=s<.25?0:Math.min(1,(s-.25)/.5);
      hd[j]=r;hd[j+1]=g;hd[j+2]=b;hd[j+3]=a*255;
      if(pid){if(c>0){const q=CLS_COL[c];pid.data[j]=q[0];pid.data[j+1]=q[1];pid.data[j+2]=q[2];pid.data[j+3]=115}else pid.data[j+3]=0}
    }

    lbctx.clearRect(0,0,w,h);lbctx.filter="blur(1.5px)";lbctx.drawImage(layer,0,0);lbctx.filter="none";layerReady=true;
    if(pid){pctx.putImageData(pid,0,0);partsReady=true}
    const avg=c=>sm[c]>8?[(sr[c]/sm[c])|0,(sg[c]/sm[c])|0,(sb[c]/sm[c])|0]:null;
    let ls=0,ln=0;for(let k=0;k<px.length;k+=64){ls+=px[k]*.3+px[k+1]*.59+px[k+2]*.11;ln++}
    scene={pct:cnt.map(v=>v/n),col:{1:avg(1),2:avg(2),3:avg(3),4:avg(4)},dbg:{del:segDel,w,h,mx,lum:Math.round(ls/Math.max(1,ln)),pct:cnt.map(v=>Math.round(v/n*100))}};
    hairPct=scene.pct[1];segFailCnt=0;segErr="";segRuns++;

    if(segRuns===1||segRuns%10===0){refreshBadge();renderScene()}
  })}catch(e){
    segFailCnt++;segErr=String((e&&e.message)||e).slice(0,60);
    if(segFailCnt>=2&&segDel==="GPU"&&!segSwitching){segSwitching=true;segmenter=null;makeSegmenter("CPU").finally(()=>{segSwitching=false;segFailCnt=0;refreshBadge()})}

  }
}
function paintHair(){

function frame(ts){

}
async function makeSegmenter(del){

async function loadModels(){
  if(modelsState!=="idle")return;modelsState="loading";setBadge(T().loadingAI);
  const v="0.10.14",base=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${v}`;
  try{
    vision=await import(base+"/vision_bundle.mjs");
    fileset=await vision.FilesetResolver.forVisionTasks(base+"/wasm");
    try{landmarker=await vision.FaceLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:LM_URL},runningMode:"IMAGE",numFaces:1})}catch(e){}
    for(const d of(SEG_DELEGATE==="GPU"?["GPU","CPU"]:["CPU","GPU"])){if(await makeSegmenter(d))break}
    modelsState=(landmarker||segmenter)?"ready":"fail";
  }catch(e){modelsState="fail";segErr=String((e&&e.message)||e).slice(0,60)}

}
const FACE={top:10,chin:152,cl:234,cr:454,jl:172,jr:397,fl:54,fr:284};
const dist=(a,b,w,h)=>Math.hypot((a.x-b.x)*w,(a.y-b.y)*h);
function classify(lm,w,h){
  const L=dist(lm[FACE.top],lm[FACE.chin],w,h),cheek=dist(lm[FACE.cl],lm[FACE.cr],w,h),jaw=dist(lm[FACE.jl],lm[FACE.jr],w,h),fore=dist(lm[FACE.fl],lm[FACE.fr],w,h);
  const lw=L/cheek,jc=jaw/cheek,fc=fore/cheek;
  if(lw>1.48)return"oblong";
  if(jc<.76&&fc>.82)return"heart";

  return jc>.9&&lw<1.38?"square":"oval";
}
async function analyze(){

  setShape(classify(res.faceLandmarks[0],c.width,c.height));
}

function hslOf(c){

  return[h,s,l];
}
function colorName(c){
  const[h,s,l]=hslOf(c);
  const N=lang==="de"?["Schwarz","Weiß","Grau","Braun","Rot","Orange","Gelb","Grün","Türkis","Blau","Lila","Rosa","dunkel","hell"]:["Siyah","Beyaz","Gri","Kahverengi","Kırmızı","Turuncu","Sarı","Yeşil","Turkuaz","Mavi","Mor","Pembe","koyu","açık"];

  else if(h<70)n=l<.45?br:ye;
  else if(h<165)n=gr;else if(h<200)n=cy;else if(h<255)n=bl;else if(h<290)n=pu;else n=pk;

  const set=(k,col,text)=>{const sw=$("sw"+k),tx=$("tx"+k);if(!sw||!tx)return;
    if(col){sw.style.background=`rgb(${col[0]},${col[1]},${col[2]})`;tx.textContent=text||colorName(col)}
    else{sw.style.background="transparent";tx.textContent="–"}};
  if(!scene||scene.pct[1]+scene.pct[2]+scene.pct[3]+scene.pct[4]<.02){
    msg.textContent=scene?t.noPerson:(running?t.lookingAt:t.sceneHint);
    set("H",null);set("S",null);set("C",null);
    if(rb&&rb.dataset.k){rb.innerHTML="";rb.dataset.k=""}
    return;
  }
  msg.textContent="";
  const p=scene.pct,sk=scene.col[3]||scene.col[2];
  set("H",p[1]>.01?scene.col[1]:null,`${p[1]>.01&&scene.col[1]?colorName(scene.col[1]):""} · %${Math.round(p[1]*100)}`);
  let tone="neutral";
  if(sk){const hh=hslOf(sk)[0];tone=hh>=26?"warm":hh<=14?"cool":"neutral"}
  const lv=sk?hslOf(sk)[2]:0;
  set("S",sk,sk?`${t.skinLv[lv>.62?0:lv>.38?1:2]} · ${t[tone]}`:"");
  set("C",scene.col[4]);
  if(rb&&rb.dataset.k!==tone){
    const idx={warm:[3,5,2,1],cool:[4,8,6,9],neutral:[1,2,6,3]}[tone];
    rb.innerHTML=idx.map(i=>`<button style="background:${COLORS[i].c}" data-act="rec" data-v="${i}" aria-label="${COLORS[i][lang]}"></button>`).join("");
    rb.dataset.k=tone;
  }
}
function toggleMode(){
  mirrorMode=!mirrorMode;
  $("stage").classList.toggle("mirror",mirrorMode);document.body.classList.toggle("mirror",mirrorMode);
  actions();setBadge(mirrorMode?T().mirrorNote:T().tryNote,4500);
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderChat(){
  const box=$("chat");if(!box)return;
  if(!chatLog.length)chatLog.push({n:1,t:T().hello});
  box.innerHTML=chatLog.map(m=>`<div class="msg ${m.n?"n":"u"}">${esc(m.t)}</div>`).join("");box.scrollTop=box.scrollHeight;
}
function setLang(l){
  lang=l;document.documentElement.lang=l;
  $("l-tr").classList.toggle("on",l==="tr");$("l-de").classList.toggle("on",l==="de");
  rail();actions();cover();panel();clock();refreshBadge();$("adTap").textContent=T().tap;
  if(rec)rec.lang=T().speech;
}
function clock(){
  const d=new Date(),loc=lang==="de"?"de-DE":"tr-TR";
  $("clk").textContent=d.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"});
  $("dt").textContent=d.toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long"});
}

/* ================= SES VE SOHBET ================= */
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang=T().speech;
  const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith(T().speech.slice(0,2)));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function toggleMic(){
  if(!SR){setBadge(T().nomic,3500);return}
  if(listening){rec.stop();return}
  if(tab!=="chat"){tab="chat";rail();panel()}
  speechSynthesis.cancel();
  rec=new SR();rec.lang=T().speech;rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{listening=true;setBadge(T().listening);actions()};
  rec.onend=()=>{listening=false;refreshBadge();actions()};
  rec.onerror=()=>{};
  rec.onresult=e=>ask(e.results[0][0].transcript);
  rec.start();
}
async function brain(q){
  if(AI_ENDPOINT){
    try{const r=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang,message:q,faceShape:shape})});const j=await r.json();if(j.reply)return j.reply}catch(e){}
  }
  const k=T().kw,s=q.toLowerCase();
  if(k.thanks.test(s))return T().thanks;
  if(k.price.test(s))return T().price+SERVICES.slice(0,5).map(x=>`${x[lang]} ${eur(x.p)}`).join(", ")+".";
  if(k.color.test(s))return T().colors(COLORS.map(c=>c[lang]).join(", "));
  if(k.style.test(s))return shape?T().sugg(SHAPES[shape]["s_"+lang].slice(0,3).join(", ")):T().askFace;
  if(k.hello.test(s))return T().hello;
  return T().fallback;
}
async function ask(q){
  q=(q||"").trim();if(!q)return;
  if(tab!=="chat"){tab="chat";rail();panel()}
  chatLog.push({n:0,t:q});renderChat();
  const a=await brain(q);chatLog.push({n:1,t:a});renderChat();speak(a);
  const i=$("inp");if(i)i.value="";
}

/* ================= OLAYLAR ================= */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==="lang")setLang(v);
  else if(a==="tab"){tab=v;rail();panel()}
  else if(a==="start")startCam();
  else if(a==="analyze")analyze();
  else if(a==="photo")photo();
  else if(a==="mode")toggleMode();
  else if(a==="parts"){showParts=!showParts;partsReady=false;panel()}
  else if(a==="rec"){colorIdx=+v;layerReady=false;hairPct=-1;if(!running)setBadge(T().needCam,2500);else{loadModels();refreshBadge()}panel()}
  else if(a==="mic")toggleMic();
  else if(a==="shape")setShape(v);
  else if(a==="again"){shape=null;refreshBadge();panel()}
  else if(a==="color"){
    colorIdx=v==="none"?null:+v;layerReady=false;hairPct=-1;
    if(colorIdx!==null){if(!running)setBadge(T().needCam,2500);else{loadModels();refreshBadge()}}
    else refreshBadge();
    panel();
  }
  else if(a==="ask")ask(v);
  else if(a==="send")ask($("inp").value);
  else if(a==="closecmp")$("cmp").classList.remove("on");
  else if(a==="save")save();
});
document.addEventListener("input",e=>{if(e.target.id==="int")intensity=e.target.value/100});
document.addEventListener("keydown",e=>{if(e.target.id==="inp"&&e.key==="Enter")ask(e.target.value)});

/* ================= REKLAM EKRANI ================= */
const atr=$("attract");
function adTick(){
  if(!atr.classList.contains("on"))return;
  const L=ADS[lang];adIdx=(adIdx+1)%L.length;$("adMsg").textContent=L[adIdx];
}
function showAttract(){
  atr.classList.add("on");adIdx=0;$("adMsg").textContent=ADS[lang][0];$("adTap").textContent=T().tap;
  const v=$("adVid");if(ADS.video){v.src=ADS.video;v.hidden=false;v.play().catch(()=>{})}
}
function touch(){lastTouch=Date.now()}
["pointerdown","pointermove","keydown"].forEach(n=>window.addEventListener(n,touch,{passive:true}));
atr.addEventListener("pointerdown",()=>{atr.classList.remove("on");$("adVid").pause();touch()});
setInterval(()=>{
  clock();
  if(!atr.classList.contains("on")&&!listening&&!$("cmp").classList.contains("on")&&Date.now()-lastTouch>IDLE_MS)showAttract();
},1000);
setInterval(adTick,5000);
setInterval(()=>{if(tab==="face")renderScene()},1500);

/* ================= BAŞLAT ================= */
if("speechSynthesis" in window)speechSynthesis.getVoices();
resize();setLang("tr");
</script>
